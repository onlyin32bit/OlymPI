<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// A blank page hides the cause on devices without dev tools: print script errors on the page.
			(function () {
				function show(message) {
					var box = document.getElementById('4t-boot-error');
					if (!box) {
						box = document.createElement('pre');
						box.id = '4t-boot-error';
						box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:50vh;overflow:auto;margin:0;padding:8px;background:#7f1d1d;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;z-index:2147483647';
						(document.body || document.documentElement).appendChild(box);
					}
					box.textContent += message + '\n';
				}
				window.addEventListener('error', function (e) {
					show('Lỗi: ' + (e.message || 'script') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
				});
				// A dropped chunk download (flaky LAN) leaves the app blank: reload, up to 3 times.
				function retryChunk(message) {
					if (!/dynamically imported module|Importing a module script failed|error loading dynamically/i.test(message || '')) return false;
					var tries = Number(sessionStorage.getItem('4t-chunk-retry') || '0');
					if (tries >= 3) return false;
					sessionStorage.setItem('4t-chunk-retry', String(tries + 1));
					show('Tải lại do lỗi mạng (' + (tries + 1) + '/3)…');
					setTimeout(function () { location.reload(); }, 800);
					return true;
				}
				window.addEventListener('load', function () {
					setTimeout(function () { sessionStorage.removeItem('4t-chunk-retry'); }, 15000);
				});
				window.addEventListener('unhandledrejection', function (e) {
					var message = e.reason && e.reason.message ? e.reason.message : String(e.reason);
					if (retryChunk(message)) return;
					show('Lỗi (promise): ' + message);
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
